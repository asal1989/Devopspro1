name: document_scanner
description: A professional AI-powered document scanning application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Navigation
  go_router: ^14.2.0

  # State management
  provider: ^6.1.2

  # Formatting & utils
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.4.0

  # Camera & gallery (Phase 2)
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Image processing (Phase 3)
  image: ^4.2.0

  # PDF generation, storage & sharing (Phase 4)
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  # Local storage & OCR (Phase 5)
  sqflite: ^2.3.3+1
  google_mlkit_text_recognition: ^0.13.0

  # Cloud auth & sync (Phase 6)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1

  # AI features (Phase 7) — raw HTTP to a backend proxy; Dart has no
  # official Anthropic SDK, and the API key must never ship in the app.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # No bundled assets yet — all icons are Material Icons and all
  # imagery is either a real captured photo or a generated placeholder
  # color, so there's nothing in assets/images or assets/icons to
  # declare. Add an `assets:` list here if that changes.
